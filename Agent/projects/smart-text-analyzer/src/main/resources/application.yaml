spring:
  application:
    name: smart-text-analyzer

ai:
  qwen:
    # 从环境变量 DASHSCOPE_API_KEY 中读取，避免密钥提交到 Git
    api-key: ${DASHSCOPE_API_KEY}

    # 百炼 OpenAI-compatible Chat Completions 接口
    # 学习项目第一版先使用现有兼容域名，后续再切换 Workspace 专属域名
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions

    # 当前使用的模型
    model: qwen3.8-max